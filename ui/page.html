<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <header class="title-bar">
        <div class="ornament"></div>
        <h1>Nebula Calculator</h1>
        <div class="ornament"></div>
    </header>
     <!-- Boss Buttons -->
    <div id="bossButtons" class="boss-buttons"></div>
    <div class="main-layout">
       
        <!-- Level Selection -->
<div class="card level-card">
    <h2>Star Node</h2>

    <div class="level-selection">
        <div>
            <label for="currentLevel">Current Level</label>
            <select id="currentLevel"></select>
        </div>

        <div>
            <label for="targetLevel">Desired Level</label>
            <select id="targetLevel"></select>
        </div>
    </div>
</div>

<!-- Boss -->
<div class="card boss-image-card">
    <img
        id="bossImage"
        src="../assets/lord_dubhe.png"
        alt="Lord Dubhe"
    >
</div>

        <!-- Current Resources -->
        <div class="card">
            <h2>Your Inventory</h2>
            <div class="resource-grid">
                <div class="r1"><label>Primary Shard</label><input type="number" id="res1" placeholder="0"></div>
                <div class="r2"><label>Intermediate Shard</label><input type="number" id="res2" placeholder="0"></div>
                <div class="r3"><label>Advanced Shard</label><input type="number" id="res3" placeholder="0"></div>
                <div class="r4"><label id="labelRes4">Primary Essence</label><input type="number" id="res4" placeholder="0"></div>
                <div class="r5"><label id="labelRes5">Intermediate Essence</label><input type="number" id="res5" placeholder="0"></div>
                <div class="r6"><label id="labelRes6">Advanced Essence</label><input type="number" id="res6" placeholder="0"></div>
                <div class="r7"><label id="labelRes7">Scroll</label><input type="number" id="res7" placeholder="0"></div>
                <div class="btn"><button id="calculateButton">Calculate</button></div>
            </div>
        </div>
    </div>

    <div class="view-toggle">
    <button id="farmViewButton" class="active">Farm Path & Boss Cards</button>
    <button id="resourcesViewButton">Total Resources</button>
</div>

<div id="farmView">
    <div class="card farm-path-card">

    <h2>Optimal Farm Path</h2>

    <div id="farmPath">

        <div class="farm-placeholder">
            Select one or more bosses and press Calculate.
        </div>

    </div>

</div>

<div id="bossCards"></div>

</div> <!-- farmView -->

<!-- Results -->
<div id="resourcesView">

    <div class="card results-card">

        <h2>Resources Required</h2>

        <!-- Global Shards -->
       <div class="resource-summary-section">

    <div class="shard-row">

        <div class="resource-cell">
            <label>Shards</label>
            <p>Total</p>
        </div>

        <div class="resource-cell">
            <label>Primary Shard</label>
            <p id="resultPrimaryShard">-</p>
        </div>

        <div class="resource-cell">
            <label>Intermediate Shard</label>
            <p id="resultIntermediateShard">-</p>
        </div>

        <div class="resource-cell">
            <label>Advanced Shard</label>
            <p id="resultAdvancedShard">-</p>
        </div>

    </div>

</div>

        <!-- Boss-specific resources -->
        <div id="bossResourceSections"></div>

    </div>

</div>
</div>
<script src="app.js"></script>
</body>
